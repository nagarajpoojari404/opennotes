{{- $src := .Get "src" | relURL -}}
<iframe src="{{ $src }}" title="{{ .Get "title" }}" loading="lazy" style="width:100%;height:{{ .Get "height" | default "800px" }};border:1px solid #e3e5e8;border-radius:8px;"></iframe>
<p><a href="{{ $src }}" target="_blank" rel="noopener">Open full dashboard in a new tab</a></p>
