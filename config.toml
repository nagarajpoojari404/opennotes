baseURL = "https://nagarajrpoojari.github.io/opennotes/"
languageCode = "en"
title = "Open Notes"
theme = "hextra"

enableRobotsTXT = true

# --- Markdown / math / code -------------------------------------------------
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$']]
        inline = [['$', '$']]
  [markup.highlight]
    noClasses = false

# --- Navigation -------------------------------------------------------------
[[menu.main]]
  name = "Notes"
  pageRef = "/notes"
  weight = 1

[[menu.main]]
  name = "Posts"
  pageRef = "/posts"
  weight = 2

[[menu.main]]
  name = "Projects"
  pageRef = "/projects"
  weight = 3

[[menu.main]]
  name = "About"
  pageRef = "/about"
  weight = 4

[[menu.main]]
  name = "Search"
  weight = 5
  [menu.main.params]
    type = "search"

[[menu.main]]
  name = "GitHub"
  weight = 6
  url = "https://github.com/nagarajRPoojari"
  [menu.main.params]
    icon = "github"

# --- Theme params -----------------------------------------------------------
[params]
  description = "Minimal notes"
  author = { name = "Nagaraj" }

  [params.navbar]
    displayTitle = true
    displayLogo = false
    width = "full"

  [params.theme]
    default = "system"
    displayToggle = true

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false
    width = "full"

  [params.page]
    # full (100%) | wide (90rem) | normal (80rem)
    width = "wide"

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"

  [params.toc]
    displayTags = true

  [params.highlight.copy]
    enable = true
    display = "hover"

  [params.blog.list]
    displayTags = true
    sortBy = "date"
    sortOrder = "desc"

  [params.imageZoom]
    enable = true
